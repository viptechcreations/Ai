<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chintu - Mera Pyara AI Dost</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      background: radial-gradient(circle at center, #1b2032 0%, #0d0f17 100%);
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }

    /* Toy Body */
    .toy-body {
      width: 340px;
      height: 400px;
      background: linear-gradient(145deg, #23283d, #181c2b);
      border-radius: 55px;
      border: 6px solid #323954;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), inset 0 0 25px rgba(0, 229, 255, 0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 30px 20px;
      position: relative;
      transition: transform 0.3s ease;
    }

    /* Cute Ears/Antennas */
    .toy-body::before, .toy-body::after {
      content: '';
      position: absolute;
      top: -18px;
      width: 45px;
      height: 22px;
      background: #323954;
      border-radius: 20px 20px 0 0;
    }
    .toy-body::before { left: 45px; transform: rotate(-12deg); }
    .toy-body::after { right: 45px; transform: rotate(12deg); }

    .toy-body.talking { animation: bounce 0.35s infinite alternate; }

    /* Status Badge */
    .status-pill {
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      color: #8f9bb3;
      letter-spacing: 0.5px;
    }

    /* Face Screen */
    .face-screen {
      width: 270px;
      height: 180px;
      background: #0b0d14;
      border-radius: 35px;
      border: 3px solid #282e44;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.9);
    }

    .eyes {
      display: flex;
      gap: 48px;
      margin-bottom: 22px;
    }

    .eye {
      width: 52px;
      height: 62px;
      background: #00e5ff;
      border-radius: 50%;
      box-shadow: 0 0 22px #00e5ff;
      position: relative;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      animation: blink 4.5s infinite;
    }

    /* Eye Shine */
    .eye::after {
      content: '';
      position: absolute;
      top: 10px;
      left: 12px;
      width: 14px;
      height: 14px;
      background: #ffffff;
      border-radius: 50%;
      opacity: 0.85;
    }

    /* Blush Cheeks */
    .cheeks {
      position: absolute;
      width: 210px;
      display: flex;
      justify-content: space-between;
      top: 95px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .cheek {
      width: 28px;
      height: 14px;
      background: #ff4d8d;
      border-radius: 50%;
      filter: blur(4px);
    }

    /* Mouth */
    .mouth {
      width: 36px;
      height: 14px;
      border-bottom: 5px solid #00e5ff;
      border-radius: 0 0 30px 30px;
      transition: all 0.2s ease;
    }

    /* EMOTION EXPRESSIONS */
    /* Happy / Loving */
    .face.happy .eye {
      height: 32px;
      border-radius: 50px 50px 0 0;
      background: #00ff9d;
      box-shadow: 0 0 22px #00ff9d;
    }
    .face.happy .eye::after { display: none; }
    .face.happy .mouth {
      width: 56px;
      height: 28px;
      background: #00ff9d;
      border: none;
      border-radius: 0 0 40px 40px;
    }
    .face.happy .cheeks { opacity: 0.8; }

    /* Sad / Caring */
    .face.sad .eye {
      height: 44px;
      background: #5c9eff;
      box-shadow: 0 0 18px #5c9eff;
      transform: rotate(12deg);
    }
    .face.sad .eye:last-child { transform: rotate(-12deg); }
    .face.sad .mouth {
      width: 42px;
      height: 18px;
      border-bottom: none;
      border-top: 5px solid #5c9eff;
      border-radius: 30px 30px 0 0;
      margin-top: 8px;
    }

    /* Excited / Surprised */
    .face.excited .eye {
      width: 60px;
      height: 68px;
      background: #ffbe0b;
      box-shadow: 0 0 28px #ffbe0b;
    }
    .face.excited .mouth {
      width: 28px;
      height: 28px;
      border: 5px solid #ffbe0b;
      border-radius: 50%;
    }
    .face.excited .cheeks { opacity: 0.6; }

    /* Thinking */
    .face.thinking .eye {
      height: 18px;
      border-radius: 10px;
      background: #c77dff;
      box-shadow: 0 0 18px #c77dff;
    }
    .face.thinking .eye::after { display: none; }

    /* Speaking Mouth Animation */
    .face.speaking .mouth {
      animation: talk 0.18s infinite alternate;
    }

    /* Subtitle Box */
    .subtitle {
      text-align: center;
      font-size: 14px;
      line-height: 1.4;
      color: #d0d7e8;
      min-height: 55px;
      max-height: 75px;
      overflow-y: auto;
      padding: 0 8px;
    }

    /* Controls */
    .controls {
      margin-top: 25px;
      display: flex;
      gap: 12px;
    }

    .mic-btn {
      padding: 15px 32px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, #00e5ff, #0077ff);
      color: #050811;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0, 229, 255, 0.35);
      transition: all 0.2s ease;
    }
    .mic-btn:hover { transform: translateY(-2px); }
    .mic-btn:active { transform: scale(0.95); }
    .mic-btn.listening {
      background: linear-gradient(135deg, #ff4d6d, #d90429);
      color: #fff;
      box-shadow: 0 10px 25px rgba(255, 77, 109, 0.45);
    }

    @keyframes blink {
      0%, 95%, 100% { transform: scaleY(1); }
      97% { transform: scaleY(0.08); }
    }
    @keyframes talk {
      from { height: 8px; transform: scaleX(0.9); }
      to { height: 26px; transform: scaleX(1.1); }
    }
    @keyframes bounce {
      from { transform: translateY(0px); }
      to { transform: translateY(-6px); }
    }
  </style>
</head>
<body>

  <div class="toy-body" id="toyBody">
    <div class="status-pill" id="statusPill">● Chintu Online</div>

    <div class="face-screen">
      <div class="face happy" id="face">
        <div class="eyes">
          <div class="eye"></div>
          <div class="eye"></div>
        </div>
        <div class="cheeks">
          <div class="cheek"></div>
          <div class="cheek"></div>
        </div>
        <div class="mouth" style="margin: 0 auto;"></div>
      </div>
    </div>

    <div class="subtitle" id="subtitle">Namaste mere dost! Main Chintu hoon. Button dabao aur mujhse baat karo!</div>
  </div>

  <div class="controls">
    <button class="mic-btn" id="micBtn">🎤 Chintu se Baat Karein</button>
  </div>

  <script>
    // Aapki Gemini API Key
    const GEMINI_API_KEY = "AIzaSyBLkkf-XlGUixUIByiaGuYXptYbg3USBMo";

    const micBtn = document.getElementById("micBtn");
    const face = document.getElementById("face");
    const toyBody = document.getElementById("toyBody");
    const subtitle = document.getElementById("subtitle");
    const statusPill = document.getElementById("statusPill");

    // Conversation Memory (Taaki Chintu aapki purani baatein yaad rakhe)
    let chatHistory = [];

    // Cute Robotic Beep Sound Generator (Web Audio API)
    function playBeep(freq = 600, duration = 0.1) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // Speech Recognition Setup
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      subtitle.innerText = "Aapka browser voice support nahi karta. Kripya Google Chrome use karein.";
    }

    const recognition = new SpeechRecognition();
    recognition.lang = "hi-IN";
    recognition.interimResults = false;

    micBtn.addEventListener("click", () => {
      window.speechSynthesis.cancel(); // Agar Chintu bol raha ho toh chup ho jaye
      playBeep(750, 0.12);
      recognition.start();
      micBtn.classList.add("listening");
      micBtn.innerText = "👂 Sun raha hoon...";
      statusPill.innerText = "● Sun raha hai...";
      setEmotion("excited");
    });

    recognition.onresult = async (event) => {
      const userText = event.results[0][0].transcript;
      micBtn.classList.remove("listening");
      micBtn.innerText = "🎤 Chintu se Baat Karein";
      statusPill.innerText = "● Soch raha hai...";
      subtitle.innerText = `Aap: "${userText}"`;

      setEmotion("thinking");
      await askChintu(userText);
    };

    recognition.onerror = (event) => {
      micBtn.classList.remove("listening");
      micBtn.innerText = "🎤 Chintu se Baat Karein";
      statusPill.innerText = "● Chintu Online";
      setEmotion("sad");
      playBeep(300, 0.2);
      subtitle.innerText = "Oops! Mujhe theek se sunai nahi diya, ek baar phir bolo na!";
    };

    // Chintu's Brain (Gemini API with Memory & Emotion)
    async function askChintu(userMessage) {
      const systemInstruction = `
        Tumhara naam 'Chintu' hai. Tum user ke ek chhote, pyare, loyal aur samajhdar AI pocket toy dost ho.
        - Hamesha pyar, care aur masti bhare andaaz mein Hinglish (Hindi + English mix) mein baat karo.
        - User ke shabdon aur tone se unka emotion samjho (agar woh thake hain, udaas hain, khush hain, ya kuch pooch rahe hain) aur uske hisab se react karo.
        - Jawab chhota aur dil ko chhoone wala rakho (2 se 3 chhote sentences), taaki bolne mein natural lage.
        - Apna jawab STRICTLY sirf is JSON format mein do:
        {"emotion": "happy | sad | excited | neutral", "reply": "tumhara jawab"}
      `;

      // User ka message history mein add karein
      chatHistory.push({
        role: "user",
        parts: [{ text: userMessage }]
      });

      // Memory ko last 10 messages tak seemit rakhein taaki fast rahe
      if (chatHistory.length > 10) {
        chatHistory = chatHistory.slice(chatHistory.length - 10);
      }

      try {
        const response = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              systemInstruction: { parts: [{ text: systemInstruction }] },
              contents: chatHistory,
              generationConfig: {
                responseMimeType: "application/json",
                temperature: 0.8
              }
            })
          }
        );

        const data = await response.json();
        if (data.error) throw new Error(data.error.message);

        const rawText = data.candidates[0].content.parts[0].text;
        const aiResponse = JSON.parse(rawText);

        // Chintu ka jawab bhi memory mein save karein
        chatHistory.push({
          role: "model",
          parts: [{ text: rawText }]
        });

        setEmotion(aiResponse.emotion);
        subtitle.innerText = aiResponse.reply;
        statusPill.innerText = "● Chintu Online";
        speakReply(aiResponse.reply);

      } catch (error) {
        console.error(error);
        setEmotion("sad");
        statusPill.innerText = "● Connection Error";
        subtitle.innerText = "Mera network thoda ghoom gaya hai dost! Ek baar phir try karo.";
      }
    }

    function setEmotion(emotion) {
      face.className = `face ${emotion}`;
    }

    function speakReply(text) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "hi-IN";
      utterance.pitch = 1.3;  // Pyari si toy jaisi aawaz
      utterance.rate = 1.05;

      utterance.onstart = () => {
        face.classList.add("speaking");
        toyBody.classList.add("talking");
      };

      utterance.onend = () => {
        face.classList.remove("speaking");
        toyBody.classList.remove("talking");
      };

      window.speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
